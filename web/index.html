<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rymesh">
<title>Rymesh</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<noscript><div class="noscript">需要启用 JavaScript 才能使用控制台。</div></noscript>

<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="brand">
      <h1>Rymesh</h1>
      <p class="muted">Codex CLI · Claude Code</p>
    </div>
    <p class="login-note">请在 Rymesh 的 Mac 或 Android 应用中打开。电脑上也可以运行
      <code>rymesh client open</code>。</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="top-left">
      <button id="menu-btn" class="icon-btn" aria-label="打开对话列表" aria-controls="sidebar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg></button>
    </div>
    <div class="top-title">
      <h2 id="page-title">新对话</h2>
      <div id="page-sub" class="sub"></div>
    </div>
    <div class="top-actions">
      <span id="conn-dot" class="conn-dot" title="连接状态" hidden></span>
      <button id="approval-btn" class="icon-btn approval-btn" aria-label="待审批" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 20h18L12 4zM12 10v4M12 17v.5"/></svg><span id="approval-count" class="approval-badge"></span></button>
      <button id="settings-btn" class="icon-btn" aria-label="系统设置" title="设置"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <div id="composer-wrap" class="composer-wrap" hidden>
    <div class="composer-box">
      <div id="slash-menu" class="menu slash-menu" role="listbox" aria-label="指令" hidden></div>
      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="给 Agent 发消息…" aria-label="消息内容"></textarea>
        <button id="stop-btn" class="send-btn stop-btn" type="button" aria-label="停止任务" title="停止任务" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg></button>
        <button id="send-btn" class="send-btn" type="submit" aria-label="发送"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </form>
      <div class="composer-meta">
        <div class="composer-opts">
          <div class="menu-wrap" id="agent-wrap">
            <button id="agent-btn" class="pill" type="button" aria-haspopup="listbox" aria-expanded="false" title="选择 Agent">
              <span id="agent-label"></span>
              <svg class="ico sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <div id="agent-menu" class="menu" role="listbox" aria-label="选择 Agent" hidden></div>
          </div>
          <select id="agent-select" aria-label="选择 Agent" hidden></select>
          <div class="menu-wrap">
            <button id="profile-btn" class="pill" type="button" aria-haspopup="listbox" aria-expanded="false" title="权限模式">
              <svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.2 2.8 8 7 10 4.2-2 7-5.8 7-10V6l-7-3z"/></svg>
              <span id="profile-label"></span>
              <svg class="ico sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <div id="profile-menu" class="menu" role="listbox" aria-label="权限模式" hidden></div>
          </div>
          <select id="profile-select" aria-label="权限模式" hidden></select>
          <div class="menu-wrap">
            <button id="model-btn" class="pill" type="button" aria-haspopup="listbox" aria-expanded="false" title="模型与推理强度">
              <svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7L12 3z"/></svg>
              <span id="model-label">默认模型</span>
              <svg class="ico sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <div id="model-menu" class="menu model-menu" role="listbox" aria-label="模型" hidden></div>
          </div>
        </div>
        <span id="composer-hint" class="muted small"></span>
      </div>
    </div>
  </div>
</div>

<div id="approval-stack" class="approval-stack" hidden></div>

<div id="sidebar" class="sidebar" hidden>
  <div class="sidebar-backdrop" data-sidebar-close="1"></div>
  <aside class="sidebar-panel" role="dialog" aria-modal="true" aria-label="对话列表">
    <div class="sidebar-head">
      <h2 id="sidebar-title">对话</h2>
      <button id="sidebar-new" class="icon-btn" type="button" aria-label="新对话" title="新对话"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
      <button class="icon-btn" data-sidebar-close="1" aria-label="关闭"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sidebar-search">
      <input id="session-search" type="search" placeholder="搜索标题、目录或会话 ID">
    </div>
    <div id="agent-filter" class="chip-row side-filter" role="tablist" aria-label="按 Agent 筛选"></div>
    <div id="session-list" class="sidebar-list"></div>
  </aside>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="icon-btn" data-close="1" aria-label="关闭"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/markdown.js"></script>
<script src="/app.js"></script>
</body>
</html>
